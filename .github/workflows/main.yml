name: Sync TitleDB and Release

on:
  schedule:
    # 每 2 小时运行一次
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Clone Upstream Repos
        run: |
          git clone --depth 1 https://github.com/blawar/titledb.git
          git clone --depth 1 https://github.com/dev-chin/eshopScrapper.git

      - name: Install Dependencies
        run: pip install requests

      - name: Run Python Script
        run: python -u script.py

      - name: Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add --ignore-removal output/
          git add --ignore-removal output2/
          timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "Update: ${timestamp}" || exit 0
          git push

      - name: Merge and Package ZIP
        run: |
          mkdir -p temp_merge
          if [ -d "output/titleid/" ]; then
            echo "Merging output/titleid/"
            rsync -a --ignore-existing output/titleid/ temp_merge/ 2>/dev/null || true
          fi
          if [ -d "output2/titleid/" ]; then
            echo "Merging output2/titleid/"
            rsync -a --ignore-existing output2/titleid/ temp_merge/ 2>/dev/null || true
          fi
          zip -r titleid.zip temp_merge/
          echo "ZIP size:"
          ls -lh titleid.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "latest-package"
          name: "Switch游戏信息库"
          body: |
            自动更新于 $(date -u '+%Y-%m-%d %H:%M:%S') UTC
            风灵月影专用，每 2 小时定期更新，包含游戏截图、大小、厂商等内容。
          files: titleid.zip
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
