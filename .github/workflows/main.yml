name: Sync TitleDB and Release

on:
  schedule:
    # 每 2 小时运行一次
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Clone Upstream Repos
        run: |
          git clone --depth 1 https://github.com/blawar/titledb.git
          git clone --depth 1 https://github.com/dev-chin/eshopScrapper.git

      - name: Install Dependencies
        run: pip install requests

      - name: Run Python Script
        run: python -u script.py

      - name: Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add --ignore-removal output/
          git add --ignore-removal output2/
          timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "Update: ${timestamp}" || exit 0
          git push

      - name: Merge and Package ZIP
        run: |
          mkdir -p temp_merge
          if [ -d "output/titleid/" ]; then
            echo "Merging output/titleid/"
            rsync -a --ignore-existing output/titleid/ temp_merge/ 2>/dev/null || true
          fi
          if [ -d "output2/titleid/" ]; then
            echo "Merging output2/titleid/"
            rsync -a --ignore-existing output2/titleid/ temp_merge/ 2>/dev/null || true
          fi
          zip -r titleid.zip temp_merge/
          echo "ZIP size:"
          ls -lh titleid.zip

      - name: Calculate Cumulative Downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_INFO=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest-package" || echo "{}")

          # 当前 asset 下载量
          CURRENT_COUNT=$(echo "$RELEASE_INFO" | jq -r \
            '.assets[] | select(.name=="titleid.zip") | .download_count // 0')
          CURRENT_COUNT=${CURRENT_COUNT:-0}

          # 历史累计基数（从 body 的 HTML 注释中提取）
          OLD_BODY=$(echo "$RELEASE_INFO" | jq -r '.body // ""')
          HISTORY_BASE=$(echo "$OLD_BODY" | grep -oP '(?<=<!-- history_downloads:)\d+(?= -->)' || echo "0")
          HISTORY_BASE=${HISTORY_BASE:-0}

          NEW_TOTAL=$((HISTORY_BASE + CURRENT_COUNT))

          echo "History base: $HISTORY_BASE"
          echo "Current asset downloads: $CURRENT_COUNT"
          echo "New cumulative total: $NEW_TOTAL"

          {
            echo 'RELEASE_BODY<<EOF'
            echo "自动更新于 $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            echo "风灵月影专用，每 2 小时定期更新，包含游戏截图、大小、厂商等内容。"
            echo "<!-- history_downloads:${NEW_TOTAL} -->"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "latest-package"
          name: "Switch游戏信息库"
          body: ${{ env.RELEASE_BODY }}
          files: titleid.zip
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
